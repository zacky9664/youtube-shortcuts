<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>YouTube Shortcuts — ポップアップ</title>
    <link rel="stylesheet" href="../../options/options.css" />
    <style>
      html, body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      .stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 28px;
      }
      .caption {
        color: var(--muted);
        font-size: 18px;
        margin: 0;
        text-align: center;
      }
      .caption strong {
        display: block;
        color: var(--ink);
        font-size: 28px;
        font-family: var(--font-display);
        margin-bottom: 8px;
        font-weight: 500;
      }
      .chrome {
        width: 300px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px var(--line),
          0 28px 80px rgba(0, 0, 0, 0.55);
      }
      .chrome iframe {
        display: block;
        width: 300px;
        height: 250px;
        border: 0;
      }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <p class="caption">
        <strong>ツールバーからすぐオン/オフ</strong>
        キー割り当て画面もワンクリックで開けます
      </p>
      <div class="chrome">
        <iframe src="shot-popup-inner.html" title="popup"></iframe>
      </div>
    </div>
  </body>
</html>
