<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../../options/popup.css" />
    <style>
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <header class="head">
      <img class="mark" src="../../icons/icon48.png" width="36" height="36" alt="" />
      <div>
        <h1>YouTube Shortcuts</h1>
        <p>カスタムキーボードショートカット</p>
      </div>
    </header>

    <label class="toggle">
      <input type="checkbox" checked disabled />
      <span>ショートカットを有効にする</span>
    </label>

    <div class="actions">
      <button type="button" class="primary">キー割り当てを開く</button>
      <a class="ghost" href="#">YouTube を開く</a>
    </div>

    <p class="status">有効にしました</p>
  </body>
</html>
