<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Shortcuts — 設定</title>
    <link rel="stylesheet" href="../../options/options.css" />
    <style>
      html, body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        min-height: 800px;
      }
      .page {
        padding-top: 28px;
        padding-bottom: 24px;
        width: min(820px, calc(100% - 48px));
        transform: scale(0.78);
        transform-origin: top center;
      }
      .hero { margin-bottom: 16px; }
      .hero h1 { font-size: 20px !important; }
      .lede { font-size: 14px; }
      .panel { padding: 16px 18px 12px; }
      .row { padding: 8px 12px; }
      .group-title { margin: 8px 0 2px; }
      .tips, .foot, .sync-note { display: none; }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="brand-row">
          <img class="brand-mark" src="../../icons/icon128.png" width="56" height="56" alt="" />
          <div>
            <p class="brand">YouTube Shortcuts</p>
            <p class="brand-sub">設定</p>
          </div>
        </div>
        <h1>好きなキーで、YouTube を操作する。</h1>
        <p class="lede">
          再生・シーク・音量・字幕などを、好みのショートカットに割り当てられます。
        </p>
        <div class="hero-actions">
          <label class="toggle">
            <input type="checkbox" checked disabled />
            <span>ショートカットを有効にする</span>
          </label>
          <button type="button" class="btn ghost" disabled>初期設定に戻す</button>
        </div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>キー割り当て</h2>
          <p class="hint">枠をクリックしてからキーを押すと割り当てできます。Esc でキャンセル、Backspace で解除。</p>
        </div>
        <div id="actions" class="actions"></div>
        <p class="status">保存しました: K</p>
      </section>
    </div>
    <script src="../../options/shared.js"></script>
    <script>
      const el = document.getElementById("actions");
      let group = "";
      for (const meta of ACTION_META) {
        if (meta.id === "speedDefault" || meta.id === "speedToggleDefault") continue;
        if (meta.group !== group) {
          group = meta.group;
          const g = document.createElement("div");
          g.className = "group-title";
          g.textContent = group;
          el.appendChild(g);
        }
        const row = document.createElement("div");
        row.className = "row";
        const label = document.createElement("div");
        label.className = "row-label";
        label.textContent = meta.label;
        const keycap = document.createElement("button");
        keycap.type = "button";
        keycap.className = "keycap";
        keycap.textContent = codeToLabel(DEFAULT_SHORTCUTS[meta.id] || "");
        row.append(label, keycap);
        el.appendChild(row);
      }
    </script>
  </body>
</html>
