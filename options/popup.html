<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Shortcuts</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img class="mark" src="../icons/icon48.png" width="36" height="36" alt="" />
      <div>
        <h1>YouTube Shortcuts</h1>
        <p>カスタムキーボードショートカット</p>
      </div>
    </header>

    <label class="toggle">
      <input type="checkbox" id="enabled" checked />
      <span>ショートカットを有効にする</span>
    </label>

    <div class="actions">
      <button type="button" id="open-options" class="primary">キー割り当てを開く</button>
      <a
        class="ghost"
        href="https://www.youtube.com/"
        target="_blank"
        rel="noreferrer"
        >YouTube を開く</a
      >
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
